[build-system]
requires = ["setuptools", "setuptools_scm[toml]", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bofire-candidates-api"
dynamic = ["version"]
description = "FastAPI service for generating optimization candidates using BoFire"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bofire>=0.0.15",
]

[project.optional-dependencies]
optimization = [
    "bofire[optimization]>=0.0.15",
    "uvicorn",
    "fastapi",
    "pytest",
    "requests",
    "tinydb",
]
dev = [
    "bofire[optimization]>=0.0.15",
    "uvicorn",
    "fastapi",
    "pytest",
    "requests",
    "tinydb",
    "httpx",
    "pyright",
    "mkdocs",
    "mkdocs-material",
    "pre-commit",
    "ruff",
]

[tool.setuptools]
packages = ["bofire_candidates_api"]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"
fallback_version = "0.0.1"

[tool.ruff]
target-version = "py312"
line-length = 88
output-format = "concise"

[tool.ruff.lint]
select = ["B", "C", "E", "F", "W", "I"]
ignore = [
    "E501",  # don't enforce for comments and docstrings
    "B017",  # required for tests
    "B027",  # required for optional _tell method
    "B028",
    "B904",
    "B905",
]

[tool.ruff.lint.isort]
split-on-trailing-comma = false
lines-after-imports = 2

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests requiring a live server (deselect with '-m \"not integration\"')"
]
addopts = "-m 'not integration'"
filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*:",
    "ignore::DeprecationWarning:botorch.*:",
    "ignore::UserWarning:bofire.*:",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
